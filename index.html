<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#789495">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Thyra & Simon – Hochzeit</title>
  <style>
    :root {
      --beige: #f7f3e2;
      --beige-dark: #ddd2bd;
      --teal: #789495;
      --teal-dark: #526f70;
      --mauve: #9b586f;
      --ink: #4d4843;
      --muted: #6f6962;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(191,208,207,.55), transparent 22rem),
        radial-gradient(circle at 90% 90%, rgba(155,88,111,.17), transparent 24rem),
        var(--beige);
      font-family: Arial, Helvetica, sans-serif;
    }
    .login {
      width: min(100%, 430px);
      padding: 34px 24px 28px;
      border: 1px solid rgba(120,148,149,.28);
      border-radius: 24px;
      background: rgba(255,255,255,.78);
      box-shadow: 0 18px 48px rgba(82,73,67,.16);
      text-align: center;
    }
    .flower { margin: 0 0 8px; color: var(--mauve); font-size: 2rem; }
    h1 {
      margin: 0 0 8px;
      color: var(--teal-dark);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2rem;
      font-weight: 400;
    }
    p { margin: 0 0 22px; color: var(--muted); line-height: 1.55; }
    label {
      display: block;
      margin: 0 0 7px;
      text-align: left;
      color: var(--teal-dark);
      font-size: .92rem;
      font-weight: 800;
    }
    input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--beige-dark);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fffdf7;
      color: var(--ink);
      font: inherit;
      outline: none;
    }
    input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(120,148,149,.18); }
    button {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: var(--teal-dark);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    .error {
      min-height: 1.4em;
      margin: 12px 0 0;
      color: #9b3854;
      font-size: .92rem;
    }
  </style>
</head>
<body>
  <main class="login">
    <div class="flower" aria-hidden="true">❀</div>
    <h1>Thyra & Simon</h1>
    <p>Bitte gib das Passwort ein, um den Ablauf und die weiteren Informationen zu öffnen.</p>
    <form id="loginForm">
      <label for="password">Passwort</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button id="openButton" type="submit">Webseite öffnen</button>
      <div class="error" id="error" role="alert"></div>
    </form>
  </main>

    function fromBase64(value) {
      const binary = atob(value);
      return Uint8Array.from(binary, char => char.charCodeAt(0));
    }

    async function decryptPage(password) {
      const salt = fromBase64(encrypted.salt);
      const iv = fromBase64(encrypted.iv);
      const cipherText = fromBase64(encrypted.cipherText);

      const passwordKey = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt,
          iterations: encrypted.iterations,
          hash: "SHA-256"
        },
        passwordKey,
        {name: "AES-GCM", length: 256},
        false,
        ["decrypt"]
      );

      const plainBuffer = await crypto.subtle.decrypt(
        {name: "AES-GCM", iv},
        key,
        cipherText
      );

      return new TextDecoder().decode(plainBuffer);
    }

    document.getElementById("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      const button = document.getElementById("openButton");
      const error = document.getElementById("error");
      const password = document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "Wird geöffnet …";
      error.textContent = "";

      try {
        const html = await decryptPage(password);
        document.open();
        document.write(html);
        document.close();
      } catch (_) {
        error.textContent = "Das Passwort ist nicht korrekt.";
        button.disabled = false;
        button.textContent = "Webseite öffnen";
        document.getElementById("password").select();
      }
    });
  </script>
